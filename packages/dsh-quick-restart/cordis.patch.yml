# bundle patch for the dsh-quick-restart plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-quick-restart`.
- insert:
    - id: ui-dsh-quick-restart
      name: '@linxin666/dsh-quick-restart'
